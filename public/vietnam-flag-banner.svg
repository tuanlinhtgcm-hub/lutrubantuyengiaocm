<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 360" width="100%" height="100%">
  <defs>
    <!-- Official Vietnam Flag Red Gradients -->
    <linearGradient id="flagBaseRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DA251D" />
      <stop offset="35%" stop-color="#E22C24" />
      <stop offset="70%" stop-color="#C51C15" />
      <stop offset="100%" stop-color="#9E120D" />
    </linearGradient>

    <!-- Deep Satin Shadow Gradient -->
    <linearGradient id="silkWave1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="45%" stop-color="#DA251D" stop-opacity="0" />
      <stop offset="100%" stop-color="#550502" stop-opacity="0.45" />
    </linearGradient>

    <linearGradient id="silkWave2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE885" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#DA251D" stop-opacity="0" />
      <stop offset="100%" stop-color="#460402" stop-opacity="0.5" />
    </linearGradient>

    <!-- Golden Aura of the Yellow Star -->
    <radialGradient id="starGlow" cx="20%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FFCD00" stop-opacity="0.22" />
      <stop offset="40%" stop-color="#DA251D" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#DA251D" stop-opacity="0" />
    </radialGradient>

    <!-- Silk Wave Pattern -->
    <linearGradient id="silkSheen" x1="0%" y1="0%" x2="100%" y2="30%">
      <stop offset="0%" stop-color="#DA251D" />
      <stop offset="25%" stop-color="#F03830" />
      <stop offset="50%" stop-color="#DA251D" />
      <stop offset="75%" stop-color="#B81A13" />
      <stop offset="100%" stop-color="#880E09" />
    </linearGradient>
  </defs>

  <!-- Base Flag Red Background (#DA251D) -->
  <rect width="1920" height="360" fill="url(#flagBaseRed)" />

  <!-- Flowing Silk Wave 1 -->
  <path d="M0,0 C320,80 640,-40 960,60 C1280,160 1600,20 1920,80 L1920,360 L0,360 Z" fill="url(#silkSheen)" opacity="0.65" />

  <!-- Flowing Silk Wave 2 with Highlight -->
  <path d="M0,90 C400,180 800,20 1200,140 C1600,260 1800,90 1920,120 L1920,360 L0,360 Z" fill="url(#silkWave1)" opacity="0.55" />

  <!-- Flowing Silk Wave 3 for Deep Folds -->
  <path d="M0,160 C300,60 700,240 1100,110 C1500,-20 1750,180 1920,150 L1920,360 L0,360 Z" fill="url(#silkWave2)" opacity="0.5" />

  <!-- Golden Radial Glow reminiscent of National Star & Morning Sun -->
  <rect width="1920" height="360" fill="url(#starGlow)" />

  <!-- Elegant fine satin ripples -->
  <path d="M0,0 Q480,120 960,30 T1920,80" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="6" />
  <path d="M0,60 Q520,200 1040,80 T1920,140" fill="none" stroke="#FFD700" stroke-opacity="0.06" stroke-width="4" />
  <path d="M0,140 Q460,260 920,150 T1920,200" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="8" />

  <!-- Subtle bottom vignette border for solemn contrast -->
  <rect y="354" width="1920" height="6" fill="#F59E0B" opacity="0.8" />
</svg>
